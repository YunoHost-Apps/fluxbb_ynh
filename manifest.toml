packaging_format = 2

id = "fluxbb"
name = "FluxBB"
description.en = "Fast, light, user-friendly forum software"
description.fr = "Forum de discussions rapide et léger"

version = "1.5.11.87~ynh1"

maintainers = []

[upstream]
license = "GPL-2.0-only"
website = "https://fluxbb.org/"
demo = "https://fluxbb.org/forums/index.php"
admindoc = "https://fluxbb.org/docs/"
code = "https://github.com/MioVisman/FluxBB_by_Visman"

[integration]
yunohost = ">= 12.0.9"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false

sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/fluxbb"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

    [install.password]
    type = "password"

[resources]
        [resources.sources.main]
        url = "https://github.com/MioVisman/FluxBB_by_Visman/archive/refs/tags/1.5.11.87.tar.gz"
        sha256 = "c23c202775f81b683a9377d2a6fc853c99aa7a7e3425a1d278a9a88c584adb65"

        autoupdate.upstream = "https://github.com/MioVisman/FluxBB_by_Visman"
        autoupdate.strategy = "latest_github_tag"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = "mariadb-server, php8.4-curl, php8.4-intl, php8.4-mbstring, php8.4-xmlrpc, php8.4-mysql, php8.4-gd, php8.4-xml, php8.4-cli, php8.4-imagick, php8.4-bcmath, php8.4-gmp, php8.4-zip"

    [resources.database]
    type = "mysql"
