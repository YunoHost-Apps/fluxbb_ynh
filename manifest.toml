packaging_format = 2

id = "fluxbb"
name = "FluxBB"
description.en = "Fast, light, user-friendly forum software"
description.fr = "Forum de discussions rapide et léger"

version = "1.5.11.86~ynh1"

maintainers = []

[upstream]
license = "GPL-2.0-only"
website = "https://fluxbb.org/"
demo = "https://fluxbb.org/forums/index.php"
admindoc = "https://fluxbb.org/docs/"
code = "https://github.com/MioVisman/FluxBB_by_Visman"

[integration]
yunohost = ">= 12.0.9"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false

sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/fluxbb"

    [install.admin]
    type = "user"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.password]
    type = "password"

[resources]
        [resources.sources.main]
        url = "https://github.com/MioVisman/FluxBB_by_Visman/archive/refs/tags/1.5.11.86.tar.gz"
        sha256 = "929644f5bfd8fdd34c4f9811a79af0a99edf92ddef4dc7d92464a8c2d8b91132"

        autoupdate.upstream = "https://github.com/MioVisman/FluxBB_by_Visman"
        autoupdate.strategy = "latest_github_tag"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = "mariadb-server, php7.4-fpm, php7.4-common, php7.4-curl, php7.4-intl, php7.4-mbstring, php7.4-xmlrpc, php7.4-mysql, php7.4-gd, php7.4-xml, php7.4-cli, php7.4-imagick, php7.4-bcmath, php7.4-gmp, php7.4-zip"

    [resources.database]
    type = "mysql"
